[project]
name = "arbagent"
version = "0.1.0"
description = "Autonomous triangular-arbitrage agent for Binance spot. Paper trading by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
arbagent = "arbagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arbagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
